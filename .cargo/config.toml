# `crates/d3home/tests/cli.rs`'s `support::config_with` names its temp
# directory after `std::process::id()`. That is unique per *process*, but
# `cargo test`'s default test harness runs every #[test] function in a
# single binary as threads within one process, so every test in that file
# shares the same PID and therefore the same config path. Run concurrently,
# they clobber each other's `devices.toml` mid-test (one test's simulator
# address gets overwritten by another's before the CLI subprocess reads it),
# which shows up as spurious wrong-endpoint/wrong-token failures that have
# nothing to do with the code under test.
#
# Forcing single-threaded test execution avoids the collision without
# touching the test file, whose contents are specified verbatim. Test
# binaries across the workspace are still fast enough that running them
# serially costs a fraction of a second.
[env]
RUST_TEST_THREADS = "1"
