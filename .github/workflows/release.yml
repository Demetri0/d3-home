name: Release

# Everything here exists because packages have to be built where their tools
# live: a .deb needs dpkg, an .msi needs WiX on Windows, and an .app needs
# iconutil on a Mac. None of that can be done honestly from one machine.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # Apple silicon only. macos-13 was removed outright -- a run
          # requesting it waits forever for a machine that no longer exists
          # -- and macos-14 is deprecated behind it. The Intel image that
          # replaces them, macos-15-intel, is announced as the last x86_64
          # macOS runner there will ever be, so building on it would buy a
          # binary with an expiry date on it.
          - os: macos-26
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      # The same suite CI runs, on the machine the artefact was built on.
      # Shipping a binary nobody has run on that platform is how a release
      # goes out broken.
      - name: Test
        run: cargo test --workspace --all-features

      - name: Version
        id: version
        shell: bash
        run: echo "value=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/d3home/Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"

      - name: Archive (unix)
        if: runner.os != 'Windows'
        run: |
          make completions
          mkdir -p dist
          tar -czf "dist/d3home-${{ steps.version.outputs.value }}-${{ matrix.target }}.tar.gz" \
            -C target/release d3home
          shasum -a 256 dist/*.tar.gz > "dist/d3home-${{ matrix.target }}.sha256"

      - name: Debian package
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo install cargo-deb --locked
          cargo deb --no-build --no-strip -p d3home -o dist/
          shasum -a 256 dist/*.deb >> "dist/d3home-${{ matrix.target }}.sha256"

      - name: Application bundle (macOS)
        if: runner.os == 'macOS'
        run: |
          packaging/macos/bundle.sh
          ditto -c -k --keepParent dist/d3home.app \
            "dist/d3home-${{ steps.version.outputs.value }}-${{ matrix.target }}.app.zip"
          rm -rf dist/d3home.app
          shasum -a 256 dist/*.app.zip >> "dist/d3home-${{ matrix.target }}.sha256"

      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Pinned, and not to the newest. WiX v6 introduced the Open Source
          # Maintenance Fee and v7 refuses to run until its EULA is accepted
          # ("wix eula accept wix7"), which is a licence decision for the
          # project's owner to make rather than something a build script
          # should agree to on their behalf. v5 predates all of it.
          dotnet tool install --global wix --version 5.0.2
          # The global tools directory is not on PATH inside the step that
          # installed it, only in later ones.
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          wix build packaging/windows/d3home.wxs `
            -bindpath Bin=target/release `
            -o "dist/d3home-${{ steps.version.outputs.value }}-x86_64.msi"
          Compress-Archive -Path target/release/d3home.exe `
            -DestinationPath "dist/d3home-${{ steps.version.outputs.value }}-${{ matrix.target }}.zip"
          # Listed and hashed before anything is written, because the
          # output file lands in the same directory: piping straight into
          # Out-File made the glob pick up the file being written and fail
          # on it as locked.
          $artifacts = Get-ChildItem dist -File
          $sums = $artifacts | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" }
          $sums | Out-File -Encoding ascii "dist/d3home-${{ matrix.target }}.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Gather
        run: |
          mkdir -p dist
          find artifacts -type f -exec mv {} dist/ \;
          cat dist/*.sha256 > SHA256SUMS
          rm -f dist/*.sha256
          ls -l dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* SHA256SUMS \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
