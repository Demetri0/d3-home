name: Release

# Everything here exists because packages have to be built where their tools
# live: a .deb needs dpkg, an .msi needs WiX on Windows, and an .app needs
# iconutil on a Mac. None of that can be done honestly from one machine.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      # The same suite CI runs, on the machine the artefact was built on.
      # Shipping a binary nobody has run on that platform is how a release
      # goes out broken.
      - name: Test
        run: cargo test --workspace --all-features

      - name: Version
        id: version
        shell: bash
        run: echo "value=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/d3home/Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"

      - name: Archive (unix)
        if: runner.os != 'Windows'
        run: |
          make completions
          mkdir -p dist
          tar -czf "dist/d3home-${{ steps.version.outputs.value }}-${{ matrix.target }}.tar.gz" \
            -C target/release d3home
          shasum -a 256 dist/*.tar.gz > "dist/d3home-${{ matrix.target }}.sha256"

      - name: Debian package
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo install cargo-deb --locked
          cargo deb --no-build --no-strip -p d3home -o dist/
          shasum -a 256 dist/*.deb >> "dist/d3home-${{ matrix.target }}.sha256"

      - name: Application bundle (macOS)
        if: runner.os == 'macOS'
        run: |
          packaging/macos/bundle.sh
          ditto -c -k --keepParent dist/d3home.app \
            "dist/d3home-${{ steps.version.outputs.value }}-${{ matrix.target }}.app.zip"
          rm -rf dist/d3home.app
          shasum -a 256 dist/*.app.zip >> "dist/d3home-${{ matrix.target }}.sha256"

      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          wix build packaging/windows/d3home.wxs `
            -bindpath Bin=target/release `
            -o "dist/d3home-${{ steps.version.outputs.value }}-x86_64.msi"
          Compress-Archive -Path target/release/d3home.exe `
            -DestinationPath "dist/d3home-${{ steps.version.outputs.value }}-${{ matrix.target }}.zip"
          Get-FileHash dist/* -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Out-File -Encoding ascii "dist/d3home-${{ matrix.target }}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Gather
        run: |
          mkdir -p dist
          find artifacts -type f -exec mv {} dist/ \;
          cat dist/*.sha256 > SHA256SUMS
          rm -f dist/*.sha256
          ls -l dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* SHA256SUMS \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
