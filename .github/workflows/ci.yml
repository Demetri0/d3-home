name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Run on every platform the project claims to support, because both times
  # this has been wrong the code compiled fine and failed when run: a test
  # naming the loopback interface "lo", which is a Linux name, and a config
  # path built from HOME, which Windows does not set. `cargo check` for a
  # foreign target catches neither.
  test:
    name: test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      # First, because it needs no build and a failure here is a one-command
      # fix. Formatting cannot differ by platform, so once is enough.
      - name: Formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check

      # --all-features builds the kettle simulator too, so the device side of
      # the protocol is exercised rather than only compiled.
      - name: Test
        run: cargo test --workspace --all-features

      # On each platform, not just one: the lints that matter for a
      # cfg-gated branch are the ones that only ever compile there.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # No release binary is built for an Intel Mac any more, but people still own
  # them and can build from source. `cargo check` needs no linker for a foreign
  # target, so keeping that true costs seconds rather than a runner.
  cross:
    name: compiles for x86_64-apple-darwin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --all-features --target x86_64-apple-darwin

  msrv:
    name: minimum supported Rust (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The manifests declare rust-version = "1.88". A declared minimum that
      # nobody builds against is a guess, so build against it.
      - uses: dtolnay/rust-toolchain@1.120.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --all-features
