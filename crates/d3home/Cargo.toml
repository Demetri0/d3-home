[package]
name = "d3home"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
dialoguer = { version = "0.12.0", default-features = false, features = ["password"] }
libc = "0.2.189"
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syncleo = { path = "../syncleo" }
thiserror = "1.0"
toml = "0.8"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
serde_json = "1.0"
syncleo = { path = "../syncleo", features = ["simulator"] }
