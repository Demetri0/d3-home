[package]
name = "syncleo"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Client library for the Syncleo local UDP protocol used by Polaris IQ Home devices"
license = "MIT OR Apache-2.0"
keywords = ["polaris", "syncleo", "iot", "kettle", "protocol"]
categories = ["command-line-utilities", "network-programming"]
readme = "../../README.md"
# repository = "https://…"   # fill in once the remote exists

[features]
default = []
# The device side of the protocol, in-process. Off by default: a production
# binary that only needs to talk to a real kettle (see Task 11) has no
# business compiling the simulator's thread and socket machinery. Enabled
# below as a self-referencing dev-dependency so the crate's own test suite
# still exercises it with no extra flags.
simulator = []

[dependencies]
aes = "0.9.2"
cbc = "0.2.1"
cipher = "0.5.2"
libc = "0.2"
mdns-sd = "0.21.0"
sha2 = "0.11.0"
thiserror = "1.0"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }

[dev-dependencies]
proptest = "1.11.0"
syncleo = { path = ".", features = ["simulator"] }
